<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Sales Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>

    <header class="header-box">
        <h1>Car Sales</h1>
    </header>

    <main class="dashboard">

        <div class="chart-card">
            <h2>Price Analysis by Vehicle Brand</h2>
            <svg id="chart1" width="100%" height="100%"></svg>
        </div>

        <div class="chart-card">
            <h2>Mileage and Price Correlation Analysis</h2>
            <svg id="chart2" width="100%" height="100%"></svg>
        </div>

        <div class="chart-card">
            <h2>Fuel Type Distribution Analysis</h2>
            <div id="chart3" class="chart-container"></div>
        </div>

        <div class="chart-card">
            <h2>Vehicle Age and Usage Trend Analysis</h2>
            <div id="chart4" class="chart-container"></div>
        </div>

    </main>

    <script src="d3.js"></script>
</body>
</html>
